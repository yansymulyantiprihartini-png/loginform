<!DOCTYPE html>
<html>
  <head>
    <title>Latihan Form login</title>
    <style>
     .{
      margin: 0;
      padding: 0;
      outline: 0;
      font-family: 'Open Sans', 'Sans Serif';
       }
      body{
      height: 100vh;
      background-image: url(https://share.google/FLREzIi3EHa7L8rQh);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
        }
      .container{
      position: absolute;
      left: 50%;
      top: 50%; 
      transform: translate(-50%,-50%);
      padding: 20px, 25px;
      width: 300px;

      background-color: rgba(194, 172, 172, 0.7098039215686275);
      box-shadow: 0 0 10px rgba(255,255,255,.3);
      }
      .container h1{
      text-align: left;
      color: #fafafa;
      margin-bottom: 30px;
      text-transform: uppercase;
      border-bottom: 4px solid #e99b86;
  }
      .container label{
      text-align: left;
      color: #ffffff;
}

      .container form input{
      width: calc(100% 20px);
      padding: 8px 10px;
      margin-bottom: 15px;
      border: none;
      background-color: transparent;
      border-bottom: 2px solid #e99b86;
      color: #fff;
      font-size: 20px;
        }
        
      .container form button{
      width: 100%;
      padding: 5px 0;
      border: none;
      background-color: #e99b86;
      font-size: 18px;
      color: #fafafa;
      }
      </style>
  </head>
  <body>
    <div class="container">
      <h1>Login</h1>
      <form>
        <label>Username</label><br>
        <input type="text"><br>
        <label>Password</label><br>
        <input type="text"><br>
        <button>log in</button>
      </form>
    </div>
  </body>
  </html>
